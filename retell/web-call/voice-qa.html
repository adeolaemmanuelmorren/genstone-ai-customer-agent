<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GenStone generated-voice QA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">GenStone QA</p>
      <h1>Generated-voice call</h1>
      <p class="lede">
        This page sends prepared speech through the browser microphone track.
      </p>

      <section class="status-card" aria-live="polite">
        <span class="status-dot" id="status-dot"></span>
        <div>
          <p class="status-label">Status</p>
          <p class="status-value" id="status">Ready</p>
        </div>
      </section>

      <div class="controls">
        <button class="primary" id="start-call" type="button">Start call</button>
        <button id="end-call" type="button" disabled>End call</button>
      </div>

      <section id="fixture-controls" class="test-notes" hidden>
        <h2>Caller speech</h2>
        <div id="fixture-buttons" class="controls"></div>
      </section>

      <p class="call-reference" id="call-reference"></p>
      <pre id="event-log"></pre>
    </main>

    <script src="/assets/eventemitter3.js"></script>
    <script src="/assets/livekit.js"></script>
    <script src="/vendor-aliases.js"></script>
    <script src="/assets/retell-web-client.js"></script>
    <script src="/voice-qa-client.js"></script>
  </body>
</html>
